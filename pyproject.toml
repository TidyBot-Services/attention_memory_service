[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidybot-attention-memory-service"
version = "2.0.0"
description = "Evidence-gated AttentionBench memory authority and HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["fastapi>=0.100,<1", "pydantic>=2,<3", "uvicorn>=0.24,<1"]

[tool.setuptools.packages.find]
include = ["attention_memory_service*"]
